[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musafirs-telegram-ingestion"
version = "0.1.0"
description = "Local Telegram material collector for Musafirs Plan"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
musafirs-telegram = "musafirs_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
